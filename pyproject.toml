[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xmorl"
version = "0.1.0"
description = "Experiments on preference impact in goal-driven multi-objective reinforcement learning (MO-RL)."
readme = "README.md"
requires-python = ">= 3.10"
authors = [{ name = "Farama Foundation", email = "contact@farama.org" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Reinforcement Learning", "Multi-Objective", "RL", "AI", "Gymnasium"]
classifiers = [
    "Development Status :: 4 - Beta",  # change to `5 - Production/Stable` when ready
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
]
dependencies = [
    "gymnasium>=1.1.0",
    "numpy>=1.21",
    "pygame>=2.1.3",
    "scipy>=1.7.3",
    "mo-gymnasium>=1.3.1"
]

[project.optional-dependencies]
testing = ["pytest>=7"]

[project.urls]
Homepage = "https://mo-gymnasium.farama.org"
Repository = "https://github.com/Farama-Foundation/MO-Gymnasium"
Documentation = "https://mo-gymnasium.farama.org"
"Bug Report" = "https://github.com/Farama-Foundation/MO-Gymnasium/issues"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["xmorl", "xmorl.*"]

[tool.setuptools.package-data]
xmorl = [
    "**/*.json",
    "**/assets/*",
    "py.typed"
]

[tool.pytest.ini_options]
filterwarnings = ['ignore:.*The environment .* is out of date.*']