environment:
  id: four-room-v0
  adapter: default
  success:
    type: reward
    indices: [0, 1, 2]
    condition: all_positive
  action_names:
    0: left
    1: up
    2: right
    3: down
  objective_names:
    - item1
    - item2
    - item3

training:
  seed: 0
  num_episodes: 50000
  utility_weights: [1, 1, 1]
  alpha_q: 0.3
  gamma_q: 0.99
  alpha_p: 0.1
  gamma_p: 1.0
  epsilon_start: 1.0
  epsilon_min: 0.01
  epsilon_decay: 0.99999
  progress_every: 25000

feedback:
  enabled: true
  num_moments: 9
  episodes: null
  preview_samples: 24
  render_without_explosions: true

evaluation:
  checkpoint_episodes: 100
  checkpoint_seed_start: 50000
  final_episodes: 50
  final_seed_start: 10000
  max_steps: 200

logging:
  output_dir: runs
  run_name: null
  legacy_files: true
  wandb_enabled: true
  wandb_mode: offline
  wandb_project: xmorl
  wandb_entity: nicolas-gil-vrije-universiteit-brussel
  log_every: 5000

plotting:
  enabled: true
  show: true
  moving_average_window: 50

gui:
  enabled: true
  long_explanation: true
  trajectory_line: true